name: Build TWRP Recovery

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      WORKDIR: /mnt/twrp
      CCACHE_DIR: /mnt/ccache

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget zstd git

      - name: Prepare work directories
        run: |
          sudo mkdir -p $WORKDIR $CCACHE_DIR
          sudo chown -R $USER:$USER /mnt

      - name: Pull Droid Builder image
        run: docker pull fr3akyphantom/droid-builder:latest

      - name: Download and extract TWRP source
        run: |
          cd /mnt

          BASE_URL="https://github.com/PhantomZone54/twrp_sources_norepo/releases/download/v3.5.0_9-20210130"
          NAME="MinimalOmniRecovery-twrp-9.0-norepo-20210130.tzst"

          wget -q ${BASE_URL}/${NAME}.aa
          wget -q ${BASE_URL}/${NAME}.ab
          wget -q ${BASE_URL}/${NAME}.ac
          wget -q ${BASE_URL}/${NAME}.ad

          cat ${NAME}.a* > twrp.tar.zst

          zstd -d twrp.tar.zst
          tar -xf twrp.tar -C $WORKDIR

          rm -f ${NAME}.a* twrp.tar twrp.tar.zst

      - name: Clone device tree and recovery
        run: |
          cd $WORKDIR

          git clone https://github.com/lolmam/twrp_alcatel_3x2019-5048I.git device/TCL/5048I

          rm -rf bootable/recovery
          git clone https://github.com/omnirom/android_bootable_recovery \
            -b android-9.0 --depth 1 bootable/recovery

      - name: Build recovery inside Docker
        run: |
          docker run --rm \
            -e USER_ID=$(id -u) \
            -e GROUP_ID=$(id -g) \
            -v "$WORKDIR:/home/builder/twrp:rw" \
            -v "$CCACHE_DIR:/srv/ccache:rw" \
            fr3akyphantom/droid-builder bash << 'EOF'
              cd /home/builder/twrp
              source build/envsetup.sh
              BUILD_FLAVOR="eng"
              lunch omni_5048I-${BUILD_FLAVOR}
              make -j$(nproc) recoveryimage
          EOF

      - name: Package output
        run: |
          cd $WORKDIR

          version=$(grep 'TW_MAIN_VERSION_STR' bootable/recovery/variables.h | cut -d '"' -f2)

          cp out/target/product/5048I/recovery.img \
            TWRP-${version}-5048I-$(date +"%Y%m%d")-Unofficial.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery
          path: /mnt/twrp/*.img
