name: Build Omni TWRP 9.0 (5048I)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z-dev ccache \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python2 python-is-python2

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init TWRP Omni 9
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-9.0
          repo sync -j4 --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          cd twrp
          git clone https://github.com/lolmam/twrp_alcatel_3x2019-5048I.git device/TCL/5048I

      - name: Build recovery
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_5048I-eng
          make -j2 recoveryimage

      - name: Upload TWRP
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-5048I
          path: twrp/out/target/product/*/recovery*.img
